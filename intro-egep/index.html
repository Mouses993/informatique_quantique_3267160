<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Intro JT Spécial EGEP</title>
<style>
  /* Two faces only: one display, one UI. Point these at the brand's files in fonts/. */
  /* Deux familles : Barlow Condensed (titres) et Inter (textes). */
  @font-face { font-family: Display; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Display; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Display; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Display; src: url(fonts/barlow-condensed-latin-900-normal.woff2) format('woff2'); font-weight: 900; }
  @font-face { font-family: UI; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: UI; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: UI; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: UI; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
